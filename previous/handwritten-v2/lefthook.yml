pre-commit:
  parallel: true
  jobs:
    - name: format-staged
      glob: '*.{js,jsx,ts,tsx,svelte,json,jsonc,css,html}'
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: '*.{ts,tsx,svelte}'
      run: bun run typecheck

    - name: test-related
      glob: '*.{ts,tsx,svelte}'
      run: bun test --changed=HEAD --pass-with-no-tests
