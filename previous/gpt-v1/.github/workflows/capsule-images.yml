name: Capsule images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capsule-images.yml
      - images/Containerfile
      - bun.lock
      - package.json
      - src/**
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [identity, task]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/altitude-${{ matrix.target }}
          tags: |
            type=raw,value=edge
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Containerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=capsule-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=capsule-${{ matrix.target }}
