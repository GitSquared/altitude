name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are pure overhead on a fresh CI runner and bloat the
  # cache for the next run.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check install script
        run: shellcheck -s sh install.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the release baseline so the glibc floor is exercised in CI.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      # Keep Microsandbox's downloaded host runtime inside the workspace so
      # rust-cache can persist it together with the Cargo caches.
      MSB_HOME: ${{ github.workspace }}/.microsandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Restore build caches
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          cache-directories: ${{ github.workspace }}/.microsandbox
          # Pull requests can still restore the main branch cache without
          # spending the repository's cache budget on throwaway entries.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        # The testbed sandbox is a chroot over this machine, so the module tests
        # that drive a real task need the mount namespaces only root can make. The
        # tests skip themselves where they cannot run, so only Linux asks for it.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary="$(cargo test --locked --bin altitude --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' \
            | tail -n1)"
          sudo --preserve-env=MSB_HOME,RUST_BACKTRACE "$binary" --test-threads=1

      - name: Smoke test
        run: ./target/debug/altitude --version

  dist:
    name: dist (${{ matrix.target }})
    # Binaries belong to commits that land on main. A pull request's checkout is
    # a merge commit, and its artifacts would be thrown away.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Restore build caches
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist-${{ matrix.target }}

      - name: Build
        env:
          ALTITUDE_GIT_SHA: ${{ github.sha }}
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          set -euo pipefail
          version="$(./target/release/altitude --version)"
          echo "$version"
          case "$version" in
            *"-${GITHUB_SHA:0:6}") ;;
            *)
              echo "::error::--version does not end with the commit"
              exit 1
              ;;
          esac

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            strip -x target/release/altitude
          else
            strip target/release/altitude
          fi

          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "altitude") | .version')"
          name="altitude-${version}-${GITHUB_SHA:0:6}-${TARGET}"
          mkdir -p "dist/${name}"
          cp target/release/altitude "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

          ls -lh dist

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: altitude-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          # The archive is already compressed; a second pass only costs time.
          compression-level: 0
