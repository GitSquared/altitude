name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag, version, and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like v1.2.3 or v1.2.3-rc.1 (got '$tag')"
            exit 1
          fi

          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "altitude") | .version')"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag '$tag' does not match the Cargo.toml version '$version'"
            exit 1
          fi

          # A release must be cut from a commit that already landed on the default branch.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)"
          case "$status" in
            behind|identical) ;;
            *)
              echo "::error::Release commit $GITHUB_SHA is not on $DEFAULT_BRANCH (compare status: $status)"
              exit 1
              ;;
          esac

  build:
    name: build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # Microsandbox ships its runtime for Linux (x86_64 and aarch64) and
        # Apple silicon only, so those are the platforms we can release.
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    # Deliberately no build cache: a release artifact is assembled from a clean
    # build, not from objects another run may have written.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/altitude --version

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            strip -x target/release/altitude
          else
            strip target/release/altitude
          fi

          version="${GITHUB_REF_NAME#v}"
          name="altitude-${version}-${TARGET}"
          mkdir -p "dist/${name}"
          cp target/release/altitude "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

          ls -lh dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: altitude-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          # The archive is already compressed; a second pass only costs time.
          compression-level: 0

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: altitude-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: altitude ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  homebrew:
    name: update homebrew formula
    # Pre-releases stay out of the tap; it should only ever serve the latest
    # stable release.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP"

      - name: Generate formula
        run: ./scripts/homebrew-formula "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS"

      - name: Check formula syntax
        run: ruby -c Formula/altitude.rb

      - name: Commit formula
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain -- Formula/altitude.rb)" ]]; then
            echo "formula is already current"
            exit 0
          fi

          git add Formula/altitude.rb
          git commit -m "chore(homebrew): altitude ${GITHUB_REF_NAME}"
          git fetch origin "${DEFAULT_BRANCH}"
          git rebase "origin/${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
