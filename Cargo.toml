[package]
name = "altitude"
version = "0.9.2"
edition = "2024"
authors = ["Gabriel Saillard <gabriel@saillard.dev>"]
description = "altitude helps you get shit done with agents."
license-file = "LICENSE"
readme = "README.md"
publish = false

[lints.clippy]
absolute_paths = "warn"

[features]
# A screen of fabricated tasks to look at the interface with. Debug builds have
# it anyway; a release build needs asking, because a debug build's arithmetic is
# nowhere near fast enough to judge the interface by.
preview = []
# Helpers for driving Altitude without a real agent, network or microVM: the
# scripted harness and the fixtures tests and the TUI driver build on. Compiled
# into the binary for a test build, and under `cfg(test)` always.
testkit = []

[dependencies]
axum = "0.8.9"
arboard = { version = "3.6.1", default-features = false }
async-trait = "0.1"
base64 = "0.23.1"
cap-std = "4.0.3"
microsandbox-image = "=0.7.13"
microsandbox-utils = "=0.7.13"
tar = "0.4"
tempfile = "3"
blake3 = "1.8"
crossterm = { version = "0.29.0", features = ["event-stream"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
directories = "6"
flate2 = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
socket2 = "0.6"
hmac = "0.13"
hex = "0.4"
microsandbox = { version = "=0.7.13", default-features = false, features = ["local", "net"] }
# Embed Microsandbox's guest helper without running its host-runtime installer at build time.
microsandbox-filesystem = { version = "=0.7.13", default-features = false, features = ["download-binaries"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "auth", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
# Host CPU and memory readings, on every platform altitude runs on. Replaces the
# hand-rolled /proc parsing and the platforms it could not measure.
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"] }
terminput = "0.5.15"
terminput-crossterm = "0.4.11"
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "net",
    "macros",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.6"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = { version = "0.3.4", default-features = false, features = ["vt100"] }
# Text entry is measured in terminal columns, which is not a character count.
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
whoami = "2.1.3"
tachyonfx = "0.25.2"
bip39 = "3"
rand = "0.10"
pulldown-cmark = "0.13.6"
mermaid-rs-renderer = "0.3.1"
resvg = "0.49.0"
image = "0.25.10"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults"] }
portable-pty = { version = "0.9.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The host side of the network cache: a worker mounts the master's project cache.
# A worker is a Linux host (the host engine needs Linux), so the mount is too.
fuser = { version = "0.16", default-features = false }
