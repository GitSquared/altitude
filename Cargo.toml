[package]
name = "altitude"
version = "0.1.0"
edition = "2024"
authors = ["Gabriel Saillard <gabriel@saillard.dev>"]
description = "A personal, headless intent control plane for delegated coding work."
license-file = "LICENSE"
readme = "README.md"
publish = false

[lints.clippy]
absolute_paths = "warn"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = "0.30.2"
tokio = { version = "1.45.1", features = ["rt", "macros", "signal"] }
