[package]
name = "altitude"
version = "0.1.0"
edition = "2024"
authors = ["Gabriel Saillard <gabriel@saillard.dev>"]
description = "altitude helps you get shit done with agents."
license-file = "LICENSE"
readme = "README.md"
publish = false

[lints.clippy]
absolute_paths = "warn"

[dependencies]
axum = "0.8.9"
arboard = { version = "3.6.1", default-features = false }
base64 = "0.23.1"
cap-std = "4.0.3"
microsandbox-image = "0.7.3"
microsandbox-utils = "0.7.3"
tempfile = "3"
blake3 = "1.8"
crossterm = { version = "0.29.0", features = ["event-stream"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
directories = "6"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
socket2 = "0.6"
hmac = "0.13"
hex = "0.4"
microsandbox = { version = "0.7.3", default-features = false, features = ["local", "net"] }
# Embed Microsandbox's guest helper without running its host-runtime installer at build time.
microsandbox-filesystem = { version = "0.7.3", default-features = false, features = ["download-binaries"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
# Host CPU and memory readings, on every platform Altitude runs on. Replaces the
# hand-rolled /proc parsing and the platforms it could not measure.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
terminput = "0.5.15"
terminput-crossterm = "0.4.11"
throbber-widgets-tui = { version = "0.11.1", default-features = false }
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "io-util",
    "net",
    "macros",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.6"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = { version = "0.3.4", default-features = false, features = ["vt100"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
whoami = "2.1.3"
