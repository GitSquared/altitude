[package]
name = "altitude"
version = "0.1.0"
edition = "2024"
authors = ["Gabriel Saillard <gabriel@saillard.dev>"]
description = "A personal, headless intent control plane for delegated coding work."
license-file = "LICENSE"
readme = "README.md"
publish = false

[lints.clippy]
absolute_paths = "warn"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
chrono = "0.4"
directories = "6"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
microsandbox = { version = "0.7.3", default-features = false, features = ["local", "net"] }
# Embed Microsandbox's guest helper without running its host-runtime installer at build time.
microsandbox-filesystem = { version = "0.7.3", default-features = false, features = ["download-binaries"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
terminput = "0.5.15"
terminput-crossterm = "0.4.11"
throbber-widgets-tui = { version = "0.11.1", default-features = false }
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = { version = "0.3.4", default-features = false, features = ["vt100"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
