[package]
name = "altitude"
version = "0.1.0"
edition = "2024"
authors = ["Gabriel Saillard <gabriel@saillard.dev>"]
description = "A personal, headless intent control plane for delegated coding work."
license-file = "LICENSE"
readme = "README.md"
publish = false

[lints.clippy]
absolute_paths = "warn"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
microsandbox = { version = "0.6.17", default-features = false, features = ["net"] }
# Embed Microsandbox's guest helper without running its host-runtime installer at build time.
microsandbox-filesystem = { version = "0.6.17", default-features = false, features = ["prebuilt"] }
ratatui = "0.30.2"
throbber-widgets-tui = { version = "0.11.1", default-features = false }
tokio = { version = "1.45.1", features = ["rt", "macros", "signal", "sync", "time"] }
